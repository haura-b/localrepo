<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(320px, 90vw);
      padding: 16px;
      border-radius: 16px;
      background: #1f2937;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    #display {
      width: 100%;
      height: 70px;
      margin-bottom: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 32px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #4b5563;
    }

    .operator {
      background: #2563eb;
    }

    .operator:hover {
      background: #1d4ed8;
    }

    .equals {
      grid-row: span 2;
      background: #16a34a;
    }

    .equals:hover {
      background: #15803d;
    }

    .clear {
      background: #dc2626;
    }

    .clear:hover {
      background: #b91c1c;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <input id="display" type="text" value="0" readonly>

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="operator" data-action="backspace">⌫</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="equals" data-action="calculate">=</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const buttons = document.querySelector(".buttons");

    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.value) {
        appendValue(button.dataset.value);
      } else if (button.dataset.action) {
        handleAction(button.dataset.action);
      }
    });

    function appendValue(value) {
      if (display.value === "0" && value !== ".") {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function handleAction(action) {
      if (action === "clear") {
        display.value = "0";
      }

      if (action === "backspace") {
        display.value = display.value.length > 1
          ? display.value.slice(0, -1)
          : "0";
      }

      if (action === "calculate") {
        try {
          const result = Function(`"use strict"; return (${display.value})`)();
          display.value = Number.isFinite(result)
            ? String(Number(result.toPrecision(12)))
            : "Error";
        } catch {
          display.value = "Error";
        }
      }
    }

    document.addEventListener("keydown", (event) => {
      if (/[\d+\-*/.]/.test(event.key)) {
        appendValue(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        handleAction("calculate");
      } else if (event.key === "Backspace") {
        handleAction("backspace");
      } else if (event.key === "Escape") {
        handleAction("clear");
      }
    });
  </script>
</body>
</html>
